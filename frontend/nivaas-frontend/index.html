<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="NIVAAS — Bangalore Rental Intelligence Platform. Ward-level rent analytics, spatial search, and recommendations grounded in real transaction data." />
    <meta name="theme-color" content="#0B0E14" />

    <!--
      Fonts: Fraunces (display), Inter (ui/body — fallback for Geist Sans),
      JetBrains Mono (data — fallback for Geist Mono).
      To use the real Vercel Geist family, install the `geist` npm package
      and swap the @font-face source in src/index.css; the Tailwind config
      already lists "Geist Sans"/"Geist Mono" first in the stack so no
      further changes are needed once those files are added.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ink text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
